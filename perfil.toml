foco = """
### 🌐 En foco: una plataforma de dataspaces

Espacios de datos sobre [Eclipse Dataspace Components](https://github.com/eclipse-edc), de la base de EDC al despliegue en Kubernetes con GitOps.

| Pieza | Qué aporta |
|---|---|
| **Base EDC congelada** | [Connector](https://github.com/teo-devops/Connector) e [IdentityHub](https://github.com/teo-devops/IdentityHub) reproducibles desde un tag de git |
| **Runtimes** | Control plane, IdentityHub y emisor de credenciales, una imagen cada uno |
| **Data planes en Go** | Envoy Gateway (PULL) y Bento (PUSH y PULL) sobre Data Plane Signaling |
| **dsgen** | Un dataspace completo a partir de un único YAML |
| **[dataspace-tck](https://github.com/teo-devops/dataspace-tck)** | Prueba tu conector sin montar otro: protocolo, credenciales y el dato |
| **GitOps** | Cada pieza, un workload de Argo CD sobre [Argo-cd-Labs](https://github.com/teo-devops/Argo-cd-Labs) |

`Go` · `Java` · `Python` · `Kubernetes` · `Argo CD` · `DSP 2025-1` · `DCP`

<details>
<summary><b>dataspace-tck</b> — probar un conector de dataspace sin montar otro al lado</summary>

- Entra en el dataspace con **identidad propia** (`did:web` + credenciales DCP) y hace de consumidor o de proveedor de tu conector.
- Comprueba protocolo, credenciales, negociación y transferencia PULL/PUSH, y que **el dato llega entero y deja de llegar al terminar**.
- Web guiada, CLI con informe JUnit para CI y API. **No guarda datos** ni muestra secretos.
- Se despliega en Kubernetes con Argo CD (Gateway API + TLS).

*Comprobación de interoperabilidad, no un TCK oficial: no está afiliado a la Eclipse Foundation, IDSA ni DSSC.*

</details>

*En preparación: la mayoría de los repos son privados de momento.*
"""

